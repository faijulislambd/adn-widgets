name: Test ADN Widget Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: adn-widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required secrets/variables are set
        run: |
          check() {
            if [ -z "$2" ]; then
              echo "MISSING: $1"
              MISSING=1
            else
              echo "OK: $1 is set (${#2} chars)"
            fi
          }
          MISSING=0
          check "ADNSMS_EMAIL" "${{ secrets.ADNSMS_EMAIL }}"
          check "ADNSMS_PASSWORD" "${{ secrets.ADNSMS_PASSWORD }}"
          check "ADNSMS_URL" "${{ vars.ADNSMS_URL }}"
          check "METLIFE_EMAIL" "${{ secrets.METLIFE_EMAIL }}"
          check "METLIFE_PASSWORD" "${{ secrets.METLIFE_PASSWORD }}"
          check "METLIFE_URL" "${{ vars.METLIFE_URL }}"
          check "UPSTASH_REDIS_REST_URL" "${{ vars.UPSTASH_REDIS_REST_URL }}"
          check "UPSTASH_REDIS_REST_TOKEN" "${{ secrets.UPSTASH_REDIS_REST_TOKEN }}"
          if [ "$MISSING" = "1" ]; then
            echo "One or more required secrets/variables are missing — check names under the adn-widget environment."
            exit 1
          fi

      - name: Test Upstash Redis connectivity
        run: |
          set -e
          curl -sf -X POST "${{ vars.UPSTASH_REDIS_REST_URL }}/set/adn-widget-test-key/ok" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" > /dev/null
          RESULT=$(curl -sf "${{ vars.UPSTASH_REDIS_REST_URL }}/get/adn-widget-test-key" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}")
          echo "Upstash responded: $RESULT"
          curl -sf -X POST "${{ vars.UPSTASH_REDIS_REST_URL }}/del/adn-widget-test-key" \
            -H "Authorization: Bearer ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}" > /dev/null
          echo "Upstash Redis read/write succeeded."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install puppeteer
        run: npm install puppeteer@24 --no-save

      - name: Test ADNSMS login
        env:
          ADNSMS_EMAIL: ${{ secrets.ADNSMS_EMAIL }}
          ADNSMS_PASSWORD: ${{ secrets.ADNSMS_PASSWORD }}
          ADNSMS_URL: ${{ vars.ADNSMS_URL }}
        run: node .github/scripts/test-adnsms-login.mjs

      - name: Test METLIFE login
        env:
          METLIFE_EMAIL: ${{ secrets.METLIFE_EMAIL }}
          METLIFE_PASSWORD: ${{ secrets.METLIFE_PASSWORD }}
          METLIFE_URL: ${{ vars.METLIFE_URL }}
        run: node .github/scripts/test-metlife-login.mjs
