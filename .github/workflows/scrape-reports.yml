name: Scrape SMS Reports

on:
  schedule:
    # GitHub's own scheduler is best-effort and can lag the configured
    # interval by hours regardless of how tight the cron is — this is just a
    # background backstop, not the real freshness guarantee. That comes from
    # the dashboard/daily-report pages forcing a live scrape on first visit.
    - cron: "6,16,26,36,46,56 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment: adn-widget
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install puppeteer
        run: npm install puppeteer@24 --no-save --no-package-lock --no-audit --no-fund

      - name: Scrape ADNSMS daily report
        env:
          ADNSMS_EMAIL: ${{ secrets.ADNSMS_EMAIL }}
          ADNSMS_PASSWORD: ${{ secrets.ADNSMS_PASSWORD }}
          ADNSMS_URL: ${{ vars.ADNSMS_URL }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node .github/scripts/scrape-adnsms.mjs

      - name: Scrape METLIFE report
        env:
          METLIFE_EMAIL: ${{ secrets.METLIFE_EMAIL }}
          METLIFE_PASSWORD: ${{ secrets.METLIFE_PASSWORD }}
          METLIFE_URL: ${{ vars.METLIFE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ vars.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node .github/scripts/scrape-metlife.mjs
